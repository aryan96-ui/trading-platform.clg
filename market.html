<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market – ProTrader</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</head>

<body>
    <!-- Navigation Bar (same as dashboard) -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><i class="fas fa-chart-line"></i> <span>ProTrader</span></div>
            <div class="nav-items">
                <span class="user-info"><i class="fas fa-user"></i> <span id="user-email"></span></span>
                <div class="balance-display"><i class="fas fa-wallet"></i> <span id="nav-balance"></span></div>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar (reuse) -->
        <div class="sidebar">
            <div class="watchlist">
                <h3>Watchlist <i class="fas fa-star"></i></h3>
                <div class="stock-list">
                    <!-- static demo items; could be dynamic later -->
                    <div class="stock-item"><span class="stock-name">RELIANCE</span> <span
                            class="stock-price">₹2,450.25</span> <span class="stock-change positive">+1.5%</span></div>
                    <div class="stock-item"><span class="stock-name">TCS</span> <span
                            class="stock-price">₹3,278.50</span> <span class="stock-change positive">+0.8%</span></div>
                </div>
            </div>
            <div class="quick-actions">
                <h3>Quick Actions</h3>
                <a class="btn-action" href="market.html"><i class="fas fa-chart-line"></i> Market</a>
                <a class="btn-action" href="portfolio.html"><i class="fas fa-chart-pie"></i> Portfolio</a>
                <a class="btn-action" href="order-history.html"><i class="fas fa-history"></i> Trade History</a>
                <button class="btn-action" onclick="showPaymentModal()"><i class="fas fa-plus-circle"></i> Add
                    Funds</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2 style="color:var(--text-primary);margin-top:20px;">Market Overview</h2>
            <table id="stocks-table" style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr style="background:var(--bg-surface);color:var(--text-primary);">
                        <th style="padding:10px;">Symbol</th>
                        <th style="padding:10px;">Name</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Payment Modal (reuse from dashboard) -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Virtual Funds</h3><span class="close" onclick="hidePaymentModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p>Add virtual money to your account (demo only).</p>
                <div class="payment-options">
                    <div class="payment-option" onclick="selectAmount(10000)"><span>₹10,000</span></div>
                    <div class="payment-option" onclick="selectAmount(25000)"><span>₹25,000</span></div>
                    <div class="payment-option" onclick="selectAmount(50000)"><span>₹50,000</span></div>
                    <div class="payment-option" onclick="selectAmount(100000)"><span>₹1,00,000</span></div>
                </div>
                <div class="custom-amount"><label>Custom amount:</label><input type="number" id="custom-amount"
                        placeholder="Enter amount"></div>
                <button class="btn-pay" onclick="processPayment()"><i class="fas fa-credit-card"></i> Pay
                    (Test)</button>
            </div>
        </div>
    </div>

    <script>
        // Simple auth UI init
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) { window.location.href = 'index.html'; }
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('nav-balance').textContent = `₹${user.balance.toLocaleString()}`;

        // Fetch market list
        fetch('http://localhost:3000/api/stocks')
            .then(r => r.json())
            .then(data => {
                const tbody = document.querySelector('#stocks-table tbody');
                data.forEach(stock => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td style="padding:8px;">${stock.symbol}</td><td style="padding:8px;">${stock.name}</td>`;
                    tbody.appendChild(tr);
                });
            })
            .catch(console.error);

        // Payment modal helpers (same as dashboard)
        function showPaymentModal() { document.getElementById('payment-modal').style.display = 'block'; }
        function hidePaymentModal() { document.getElementById('payment-modal').style.display = 'none'; }
        function selectAmount(a) { document.getElementById('custom-amount').value = a; }
        function processPayment() {
            const amount = parseInt(document.getElementById('custom-amount').value) || 0;
            if (amount <= 0) { alert('Enter a valid amount'); return; }
            fetch('http://localhost:3000/api/payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: user.email, amount }) })
                .then(r => r.json())
                .then(d => { if (d.success) { user.balance = d.newBalance; localStorage.setItem('user', JSON.stringify(user)); document.getElementById('nav-balance').textContent = `₹${user.balance.toLocaleString()}`; hidePaymentModal(); alert('Payment successful'); } else alert('Payment failed'); })
                .catch(() => alert('Connection error'));
        }
        function logout() { localStorage.removeItem('user'); window.location.href = 'index.html'; }
    </script>
</body>

</html>
