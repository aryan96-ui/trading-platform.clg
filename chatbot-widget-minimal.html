<!-- --------------------------------------------------------
  ProTrader AI Chatbot - Minimal Drop-in Widget
  Paste this snippet anywhere on your ProTrader site.
  It creates a floating button that expands into a chat box.
-------------------------------------------------------- -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

<style>
    /* --- Basic floating button --- */
    #chat-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        font-size: 26px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        z-index: 1000;
        transition: all 0.3s ease;
    }

    #chat-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
    }

    /* --- Chat pane --- */
    #chat-pane {
        display: none;
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 380px;
        max-height: 500px;
        background: #1a1a2e;
        border: 1px solid #374151;
        border-radius: 16px;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
        flex-direction: column;
        overflow: hidden;
        z-index: 1000;
        animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* --- Chat header --- */
    #chat-header {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        padding: 16px;
        color: white;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    #chat-header .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }

    #chat-header .title {
        flex: 1;
    }

    #chat-header .title h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
    }

    #chat-header .title p {
        margin: 0;
        font-size: 12px;
        opacity: 0.8;
    }

    /* --- Messages area --- */
    #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 14px;
        background: #1a1a2e;
    }

    #chat-messages::-webkit-scrollbar {
        width: 6px;
    }

    #chat-messages::-webkit-scrollbar-track {
        background: #16213e;
    }

    #chat-messages::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 3px;
    }

    .msg {
        margin: 12px 0;
        display: flex;
        gap: 8px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .msg.user {
        flex-direction: row-reverse;
    }

    .msg-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
    }

    .msg.bot .msg-avatar {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
    }

    .msg.user .msg-avatar {
        background: #374151;
    }

    .msg-content {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 12px;
        line-height: 1.5;
        word-wrap: break-word;
    }

    .msg.bot .msg-content {
        background: #374151;
        color: #ffffff;
        border-bottom-left-radius: 4px;
    }

    .msg.user .msg-content {
        background: #6366f1;
        color: white;
        border-bottom-right-radius: 4px;
    }

    /* --- Typing indicator --- */
    .typing-indicator {
        display: none;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
    }

    .typing-indicator.active {
        display: flex;
    }

    .typing-dots {
        display: flex;
        gap: 4px;
        padding: 10px 14px;
        background: #374151;
        border-radius: 12px;
        border-bottom-left-radius: 4px;
    }

    .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9ca3af;
        animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {

        0%,
        60%,
        100% {
            opacity: 0.3;
            transform: translateY(0);
        }

        30% {
            opacity: 1;
            transform: translateY(-8px);
        }
    }

    /* --- Input area --- */
    #chat-input {
        display: flex;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid #374151;
        background: #16213e;
    }

    #chat-input textarea {
        flex: 1;
        border: 1px solid #374151;
        background: #1f2937;
        color: #ffffff;
        padding: 10px 16px;
        border-radius: 20px;
        resize: none;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
    }

    #chat-input textarea:focus {
        border-color: #6366f1;
    }

    #chat-input textarea::placeholder {
        color: #9ca3af;
    }

    #chat-input button {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }

    #chat-input button:hover:not(:disabled) {
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    #chat-input button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* --- Welcome message --- */
    .welcome-msg {
        text-align: center;
        padding: 40px 20px;
        color: #9ca3af;
    }

    .welcome-msg h4 {
        color: #ffffff;
        margin-bottom: 10px;
        font-size: 18px;
    }

    .welcome-msg p {
        font-size: 14px;
        line-height: 1.6;
    }
</style>

<button id="chat-btn"><i class="fa-solid fa-comment-dots"></i></button>

<div id="chat-pane">
    <div id="chat-header">
        <div class="avatar">🤖</div>
        <div class="title">
            <h3>ProTrader AI</h3>
            <p>Financial Assistant</p>
        </div>
    </div>
    <div id="chat-messages">
        <div class="welcome-msg">
            <h4>👋 Welcome to ProTrader AI!</h4>
            <p>I'm your financial trading assistant. Ask me about markets, indicators, strategies, and more.</p>
            <p style="font-size: 12px; margin-top: 10px; opacity: 0.7;">
                <em>Note: I provide educational information, not financial advice.</em>
            </p>
        </div>
    </div>
    <div id="chat-input">
        <textarea id="msg-box" rows="1" placeholder="Ask me anything about trading..."></textarea>
        <button id="send-btn">▶</button>
    </div>
</div>

<script>
    (() => {
        const btn = document.getElementById('chat-btn');
        const pane = document.getElementById('chat-pane');
        const messagesDiv = document.getElementById('chat-messages');
        const textarea = document.getElementById('msg-box');
        const sendBtn = document.getElementById('send-btn');

        // Backend URL - change this to your backend
        const BACKEND_URL = 'http://localhost:3001/api/chat';

        // --- session handling (stored in localStorage) -----------------
        let sessionId = localStorage.getItem('protrader_chat_sid');
        if (!sessionId) {
            sessionId = crypto.randomUUID();
            localStorage.setItem('protrader_chat_sid', sessionId);
        }

        // --- UI helpers ------------------------------------------------
        const addMessage = (role, text) => {
            // Remove welcome message if exists
            const welcomeMsg = messagesDiv.querySelector('.welcome-msg');
            if (welcomeMsg) welcomeMsg.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = role === 'bot' ? '🤖' : '👤';

            const content = document.createElement('div');
            content.className = 'msg-content';
            content.textContent = text;

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };

        const showTyping = () => {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator active';
            typing.id = 'typing-indicator';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
            avatar.textContent = '🤖';

            const dots = document.createElement('div');
            dots.className = 'typing-dots';
            dots.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            typing.appendChild(avatar);
            typing.appendChild(dots);
            messagesDiv.appendChild(typing);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };

        const hideTyping = () => {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        };

        // --- Send a message to the back‑end ----------------------------
        const sendMessage = async () => {
            const userText = textarea.value.trim();
            if (!userText) return;

            addMessage('user', userText);
            textarea.value = '';
            textarea.disabled = true;
            sendBtn.disabled = true;

            showTyping();

            try {
                const resp = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: userText,
                    })
                });

                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

                const data = await resp.json();
                hideTyping();

                // Handle both 'answer' and 'reply' field names
                const botReply = data.answer || data.reply || 'Sorry, I got an empty response.';
                addMessage('bot', botReply);

                // Persist session id from server (in case we generated a new one)
                if (data.session_id && data.session_id !== sessionId) {
                    sessionId = data.session_id;
                    localStorage.setItem('protrader_chat_sid', sessionId);
                }
            } catch (e) {
                console.error('Chat error:', e);
                hideTyping();
                addMessage('bot', '❌ Oops, something went wrong. Make sure the chatbot server is running on port 3001.');
            } finally {
                textarea.disabled = false;
                sendBtn.disabled = false;
                textarea.focus();
            }
        };

        // --- Event wiring ---------------------------------------------
        btn.addEventListener('click', () => {
            pane.style.display = pane.style.display === 'flex' ? 'none' : 'flex';
            if (pane.style.display === 'flex') textarea.focus();
        });

        sendBtn.addEventListener('click', sendMessage);

        textarea.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    })();
</script>
